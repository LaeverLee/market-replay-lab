<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="匯入策略，使用歷史與即時行情測試交易規則。">
<title>行情實驗室 · Market Replay</title>
<link rel="icon" href="icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css">
<script type="module" src="app.mjs"></script>
</head>
<body>
<aside class="rail">
 <a class="brand" href="#overview" aria-label="行情實驗室總覽"><span class="mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 16l5-6 4 4 7-9M14 5h5v5"/></svg></span><span>行情實驗室<small>MARKET REPLAY</small></span></a>
 <div class="rail-label">工作區</div>
 <nav aria-label="工作區">
  <a href="#overview" data-page="overview"><span data-icon="grid"></span>研究總覽</a>
  <a href="#backtest" data-page="backtest"><span data-icon="chart"></span>歷史回測</a>
  <a href="#live" data-page="live"><span data-icon="activity"></span>即時模擬<span class="nav-dot"></span></a>
  <a href="#library" data-page="library"><span data-icon="layers"></span>策略庫</a>
 </nav>
 <div class="rail-end"><div class="scope"><span class="scope-icon" data-icon="shield"></span><div>模擬工作區<small>成交與帳務僅供模擬</small></div></div><a class="help" href="#guide"><span data-icon="book"></span>策略格式與成交規則</a></div>
</aside>
<div class="shell">
 <header class="topbar"><div class="crumb"><span>工作台</span><b>/</b><strong id="crumb">研究總覽</strong></div><div class="top-actions"><span class="feed" id="feed"><i></i>即時行情未連線</span><button id="import-top" class="button primary"><span data-icon="upload"></span>匯入策略</button></div></header>
 <main id="main"></main>
</div>
<input type="file" id="strategy-file" accept=".json,.csv,.py" hidden>
<input type="file" id="market-file" accept=".csv" hidden>
<dialog id="import-dialog">
 <div class="dialog-head"><div><p class="eyebrow">STRATEGY LIBRARY</p><h2>匯入策略</h2></div><button class="icon-button" id="dialog-close" aria-label="關閉">×</button></div>
 <button class="drop-zone" id="pick-strategy"><span data-icon="upload"></span><b>選擇策略檔案或拖放到這裡</b><span>支援規則 JSON 和 Python 匯出的訊號 CSV</span></button>
 <p class="muted">規則 JSON 適用於歷史回測和即時模擬。含四欄交易訊號的 CSV 適用於歷史回測。</p>
 <div class="dialog-actions"><button id="template" class="button ghost"><span data-icon="download"></span>下載 JSON 範本</button><a class="text-link" href="#guide" id="format-guide">查看格式 <span data-icon="arrow"></span></a></div>
 <p id="import-error" class="error" role="alert" hidden></p>
</dialog>
<div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
